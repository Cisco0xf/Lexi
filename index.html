<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lexi is a simple daily word guessing game. Guess the word in 6 tries.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lexi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico"/>

  <title>Lexi</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #131314;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    /* Big L Card */
    .logo-card {
      width: 90px;
      height: 90px;
      background: #1e1e20;
      border: 3px solid #38BDF8;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: 800;
      color: #38BDF8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .loader {
      display: flex;
      gap: 12px;
    }

    .letter {
      width: 56px;
      height: 56px;
      background: #1e1e20;
      border: 2px solid #38BDF8;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      animation: flip 1.4s infinite ease-in-out;
    }

    .letter:nth-child(1) { animation-delay: 0s; }
    .letter:nth-child(2) { animation-delay: 0.15s; }
    .letter:nth-child(3) { animation-delay: 0.3s; }
    .letter:nth-child(4) { animation-delay: 0.45s; }

    @keyframes flip {
      0%, 100% { transform: rotateX(0deg); }
      50%      { transform: rotateX(180deg); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="logo-card">L</div>

    <div class="loader">
      <div class="letter">L</div>
      <div class="letter">E</div>
      <div class="letter">X</div>
      <div class="letter">I</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
